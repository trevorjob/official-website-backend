server:
  port: 8181
  servlet:
    context-path: /official

spring:
  application:
    name: official
  profiles:
    active: dev
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: UTC

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

admin:
  default:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}

# CORS Configuration
cors:
  allowed-origins: |
    https://www.msc.store
  allowed-origin-patterns: |
    https://*.vercel.app,
    https://*.netlify.app,
    http://localhost:*,
    http://127.0.0.1:*


---
# dev environment configuration
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://83.101.50.122:3306/msc-official?characterEncoding=utf-8&serverTimezone=UTC%2B1&allowMultiQueries=true&zeroDateTimeBehavior=CONVERT_TO_NULL&useSSL=false}
    username: ${DATABASE_USERNAME:${MYSQL_USER:msc-official}}
    password: ${DATABASE_PASSWORD:${MYSQL_PASSWORD:d348hDGe5@#23Fa1}}
    driver-class-name: ${DATABASE_DRIVER:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: ${DATABASE_DIALECT:org.hibernate.dialect.MySQLDialect}

---
# test environment configuration
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://83.101.50.122:3306/msc-official?characterEncoding=utf-8&serverTimezone=UTC%2B1&allowMultiQueries=true&zeroDateTimeBehavior=CONVERT_TO_NULL&useSSL=false}
    username: ${DATABASE_USERNAME:${MYSQL_USER:msc-official}}
    password: ${DATABASE_PASSWORD:${MYSQL_PASSWORD:d348hDGe5@#23Fa1}}
    driver-class-name: ${DATABASE_DRIVER:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: ${DATABASE_DIALECT:org.hibernate.dialect.MySQLDialect}

---
# pro environment configuration
spring:
  config:
    activate:
      on-profile: pro
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME:${MYSQL_USER}}
    password: ${DATABASE_PASSWORD:${MYSQL_PASSWORD}}
    driver-class-name: ${DATABASE_DRIVER:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: ${DATABASE_DIALECT:org.hibernate.dialect.MySQLDialect}