server:
  port: 8181
  servlet:
    context-path: /official

spring:
  application:
    name: official
  profiles:
    active: dev
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: UTC

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

admin:
  default:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}

# CORS Configuration
cors:
  allowed-origins: |
    http://dev-offsite.msc.store
    http://test-offsite.msc.store
    http://offsite.msc.store
  allowed-origin-patterns: |
    https://*.vercel.app,
    https://*.netlify.app,
    http://localhost:*,
    http://127.0.0.1:*



---
# dev environment configuration
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

---
# test environment configuration
