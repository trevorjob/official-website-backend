##spring.application.name=contact-form
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://mysql:3306/${MYSQL_DATABASE:contactdb}}
    username: ${DATABASE_USERNAME:${MYSQL_USER:root}}
    password: ${DATABASE_PASSWORD:${MYSQL_PASSWORD:password}}
    driver-class-name: ${DATABASE_DRIVER:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: ${DATABASE_DIALECT:org.hibernate.dialect.MySQLDialect}

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

server:
  port: 8081

admin:
  default:
    email: admin@msc.com
    password: Admin2025@

# CORS Configuration
cors:
  allowed-origins:
    - http://localhost:3000
    - http://localhost:3001
    - http://localhost:4200
    - http://localhost:5173
    - http://localhost:8080
    # Add your production frontend URLs here
  allowed-origin-patterns:
    - https://*.vercel.app # Vercel deployments
    - https://*.netlify.app # Netlify deployments
